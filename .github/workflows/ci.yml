name: CI

# 1. Kích hoạt khi push và pull_request vào nhánh main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # -------------------------------------------------
  # 2. Job test – chạy pytest trên máy sạch
  # -------------------------------------------------
  test:
    runs-on: ubuntu-latest
    # Môi trường giả cho CI (API_TOKEN và REDIS_URL không thực)
    env:
      API_TOKEN: ci-dummy
      REDIS_URL: "fake://"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5   # ← ghim phiên bản
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests (exclude CP5 & bonus)
        run: |
          pytest --ignore=tests/test_cp5.py --ignore=tests/test_bonus_cicd.py -v

  # -------------------------------------------------
  # 3. Job build – xây dựng Docker image
  # -------------------------------------------------
  build:
    runs-on: ubuntu-latest
    needs: test          # chờ test pass trước khi build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # - name: Log in to Docker Hub (optional – skip if not pushing)
        # Nếu bạn không push image đến registry, bạn có thể bỏ bước này.
        # Nếu cần, hãy thêm secret DOCKERHUB_USERNAME và DOCKERHUB_TOKEN.
        # uses: docker/login-action@v3
        # with:
        #   username: ${{ secrets.DOCKERHUB_USERNAME }}
        #   password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build Docker image
        run: |
          docker build -t day12-chat:ci .
      - name: List images (debug)
        run: docker images

  # -------------------------------------------------
  # 4. Job deploy – chỉ khi test & build xong và trên main/push
  # -------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: [test, build]            # deploy chỉ sau khi test và build đều pass
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Môi trường cho deploy (các secret được lưu ở Settings → Secrets)
    env:
      # Ví dụ cho Railway: token cá nhân có quyền deploy
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      # Hoặc cho Render: URL webhook bí mật
      # RENDER_SERVICE_HOOK_URL: ${{ secrets.RENDER_SERVICE_HOOK_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Node (for Railway CLI) – nếu dùng Railway
        if: ${{ env.RAILWAY_TOKEN != '' }}
        uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Install Railway CLI – nếu dùng Railway
        if: ${{ env.RAILWAY_TOKEN != '' }}
        run: npm i -g @railway/cli
      - name: Login to Railway – nếu dùng Railway
        if: ${{ env.RAILWAY_TOKEN != '' }}
        run: railway login --token $RAILWAY_TOKEN
      - name: Deploy to Railway – nếu dùng Railway
        if: ${{ env.RAILWAY_TOKEN != '' }}
        run: |
          railway up --service day12-chat   # thay tên service nếu cần
          railway domain   # lấy public URL (tùy chọn)
      - name: Deploy to Render – nếu dùng Render (webhook)
        if: ${{ env.RENDER_SERVICE_HOOK_URL != '' }}
        run: |
          curl -X POST "$RENDER_SERVICE_HOOK_URL"
      - name: Wait for service to be ready (simple)
        run: sleep 30
      - name: Smoke test – gọi /healthz trên service vừa deploy
        env:
          # PUBLIC_URL có thể được lưu dưới dạng Variable (không bí mật) hoặc lấy từ output deploy
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}   # ← bạn cần tạo Variable này ở Settings → Variables
        run: |
          echo "Smoke test against $PUBLIC_URL"
          curl -fsS "$PUBLIC_URL/healthz" || (echo "Health check failed" && exit 1)

  # -------------------------------------------------
  # 5. (Tùy chọn) Job smoke riêng – nếu bạn muốn tách ra
